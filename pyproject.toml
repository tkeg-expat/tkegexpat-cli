[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tkegexpat-cli"
version = "0.1.0"
description = "TKEG Expat command-line interface"
requires-python = ">=3.9"

[project.scripts]
tkegexpat = "tkegexpat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
